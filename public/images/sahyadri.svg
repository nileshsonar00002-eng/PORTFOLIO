<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="sahyadriGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C47B52" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#141414" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E0E0E" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="ridgeGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242220" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <linearGradient id="ridgeGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E2824" />
      <stop offset="100%" stop-color="#151413" />
    </linearGradient>
    <linearGradient id="ridgeGradient3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B2E24" />
      <stop offset="100%" stop-color="#181615" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#sahyadriGlow)" />
  <rect width="800" height="500" fill="none" stroke="#292929" stroke-width="1.5" />

  <!-- Topographic Contour Lines -->
  <g opacity="0.25" stroke="#C47B52" stroke-width="1" fill="none">
    <path d="M 0 160 Q 200 120 400 170 T 800 130" stroke-dasharray="4 6" />
    <path d="M 0 200 Q 220 170 420 210 T 800 180" stroke-dasharray="2 4" />
    <path d="M 0 240 Q 240 210 440 250 T 800 220" />
    <circle cx="580" cy="180" r="40" stroke-dasharray="3 5" />
    <circle cx="580" cy="180" r="22" stroke-dasharray="2 4" />
  </g>

  <!-- Mountain Peak 1 (Background Silhouette) -->
  <path d="M 40 400 L 220 180 L 360 260 L 520 150 L 680 270 L 780 400 Z" fill="url(#ridgeGradient1)" opacity="0.7" />

  <!-- Mountain Peak 2 (Midground Ridge with Western Ghats Pinnacle) -->
  <path d="M -40 450 L 160 220 L 280 300 L 440 170 L 600 320 L 760 230 L 840 450 Z" fill="url(#ridgeGradient2)" />
  <path d="M 160 220 L 280 300 L 440 170" fill="none" stroke="#C47B52" stroke-width="1.5" opacity="0.6" />

  <!-- Foreground Forest Ridge -->
  <path d="M -20 500 L 100 320 L 260 380 L 380 280 L 540 370 L 720 290 L 820 500 Z" fill="url(#ridgeGradient3)" />
  <path d="M 100 320 L 260 380 L 380 280 L 540 370 L 720 290" fill="none" stroke="#D28A5C" stroke-width="1.8" opacity="0.8" />

  <!-- Altitude & Point of Interest Markers -->
  <g transform="translate(380, 275)">
    <circle cx="0" cy="0" r="5" fill="#C47B52" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#C47B52" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="0" y1="-14" x2="0" y2="-40" stroke="#C47B52" stroke-width="1" />
    <rect x="-65" y="-62" width="130" height="22" rx="4" fill="#141414" stroke="#292929" stroke-width="1" />
    <text x="0" y="-47" font-family="'Plus Jakarta Sans', monospace" font-size="10" fill="#F4F1EA" text-anchor="middle" font-weight="600">HARISHCHANDRAGAD 1424m</text>
  </g>

  <!-- Clean Floating Overlay Data Card -->
  <g transform="translate(40, 40)">
    <rect width="250" height="68" rx="8" fill="#141414" stroke="#292929" stroke-width="1" opacity="0.95" />
    <circle cx="20" cy="34" r="5" fill="#C47B52" />
    <text x="36" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#F4F1EA" letter-spacing="0.5">SAVE SAHYADRI PORTAL</text>
    <text x="36" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#A7A29A">Ecological Protection &amp; Community</text>
    <text x="36" y="58" font-family="'Plus Jakarta Sans', monospace" font-size="9" fill="#C47B52">BIODIVERSITY INDEX: 94.2%</text>
  </g>

  <!-- Right Floating Metric -->
  <g transform="translate(560, 40)">
    <rect width="200" height="74" rx="8" fill="#141414" stroke="#292929" stroke-width="1" opacity="0.95" />
    <text x="18" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#77736D" letter-spacing="1">REGISTERED VOLUNTEERS</text>
    <text x="18" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" fill="#F4F1EA">3,200+<tspan font-size="12" fill="#C47B52" font-weight="500"> advocates</tspan></text>
  </g>

  <!-- Bottom Coordinates & Integrity Bar -->
  <g transform="translate(40, 430)">
    <rect width="720" height="38" rx="6" fill="#141414" stroke="#292929" stroke-width="1" />
    <text x="20" y="23" font-family="'Plus Jakarta Sans', monospace" font-size="11" fill="#A7A29A">WESTERN GHATS ECO-ZONE // FIREBASE HOSTING // ZERO CARBON TARGET</text>
    <text x="700" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#C47B52" font-weight="600" text-anchor="end">CONSERVATION LIVE</text>
  </g>
</svg>
